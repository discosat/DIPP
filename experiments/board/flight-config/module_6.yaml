  type: 5
  value: /usr/share/models/cs12g050_p_w08d3_r096.tflite
- key: class_index
  type: 3
  value: 0
- key: threshold_percentage
  type: 4
  value: 0.5
- key: pixel_threshold
  type: 4
  value: 0.5
- key: mask_lowpass
  type: 3
  value: 5
- key: use_npu
  type: 3
  value: 1
