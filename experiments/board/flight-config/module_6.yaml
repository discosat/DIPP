# Cloud segmentation, LOW effort -- plain U-Net w8 d3 @96, PTQ.
# IoU 0.639, precision 0.885, recall 0.697, FP on cloud-free scenes 2.89%.
# 5.1 ms/tile on the NPU.
#
# threshold_percentage is FIXED at 0.5 across all efforts, deliberately.
# The module keeps a tile when kept_pixels > threshold_percentage * img_size,
# i.e. the threshold is the minimum fraction of CLEAR pixels, so 0.5 means
# "keep unless the tile is majority cloud" -- the same rule the encoder
# downstream is supposed to be fed by. It was 0.05 at low effort and 0.7 at
# high, which made retention a function of the effort level rather than of
# the scene, so every low-vs-high comparison measured two things at once.
#
# Model: CloudSEN12+ (Sentinel-2 L1C, expert masks) at the frozen rendering
# (gain 0.050, module_1.yaml), TF 2.9.1 export, input quantisation (2/255,
# 127|128) = the module's raw-uint8 passthrough contract; graph verified
# TRANSPOSE=0, dynamic=0 before it reached the board, so it runs on the NPU
# (use_npu 1). Quality is IoU against expert masks on the CloudSEN12
# VALIDATION split, 535 scenes, device-footprint tiles; test is quoted once
# at the end of Stage 4.5.
#
# Costs measured on the board 2026-09-13 (analysis/stage4.5-models/
# dev_cs12_g050.json): warm run (one cold run discarded -- the VX graph
# compile alone is 11-23 s), n=50 batches of koge-coast-full-clouds, median
# EXEC latency, idle-corrected energy differenced against a demosaic+tile
# baseline at the same n with P_idle = 2.7470 W from the same session.
#
# energy_cost was an estimate until 2026-09-15 (the rung measured -71 uWh
# against a baseline that uploads 15 MB where a threshold-1.0 run uploads
# nothing -- the I/O bias, README "Energy, calibrated"). Now measured:
# keep-none run minus the fixed stages, per-run idle floor.
latency_cost: 565800
# energy_cost MEASURED 2026-09-17 (tools/update_energy_hints.py): segmentation low, 99 tiles, I/O-matched;
# idle floor read before every run, settled reps [2], I/O term removed
# (analysis/stage4.5-models/stage_energy.json, encoder_energy.json).
energy_cost: 163
parameters:
