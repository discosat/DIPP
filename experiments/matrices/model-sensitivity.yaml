# RETIRED 2026-09-14: the five device frames are no longer used for anything; see ~/dipp-datasets/cs12-frames.
# Does the pipeline's output depend on its input at all?
#
# Five scenes that should be trivially separable: amager is urban Copenhagen
# (expect class 7, Residential), koge-coast is open water (expect class 9,
# SeaLake), and the cloud variants test whether cloud cover moves the decision.
# If the class histograms come back indistinguishable, the models are not
# seeing the image -- which would invalidate every retention and downlink
# number in the paper.
#
# Pipeline 2 (static LOW) so the classifier is fixed at custom_conv_model and
# nothing adapts underneath the comparison. MEM so persistence is out of the
# picture too. One batch per run: the question is content, not throughput.
run_set: model-sensitivity
defaults:
  # scheduling policy stated explicitly (run.sh requires it, 2026-10-06)
  sched_q_med: 12
  sched_q_low: 20
  sched_granularity: batch
  sched_gate_med_ms: 5000
  sched_gate_low_ms: 3000
  min_drain: 20      # explicit: run.sh no longer defaults it (2026-10-03)
  n: 1
  images: 1
  seed: 43
  load: populate
  heuristic: BEST_EFFORT
  pipeline: 2
  storage: MEM
runs:
  - {label: sens-amager-no-clouds,     image: amager-no-clouds.bayerRG}
  - {label: sens-amager-light-clouds,  image: amager-light-clouds.bayerRG}
  - {label: sens-koge-no-clouds,       image: koge-coast-no-clouds.bayerRG}
  - {label: sens-koge-light-clouds,    image: koge-coast-light-clouds.bayerRG}
  - {label: sens-koge-full-clouds,     image: koge-coast-full-clouds.bayerRG}
