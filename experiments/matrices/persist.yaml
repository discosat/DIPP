# System-level cost of persistence (2026-10-12): v2 with no persistence (MEM) and every module
# persisted (MMAP), seed 1; the default (HYBRID) runs are in eval2. Plus static low with MMAP in C5.
run_set: persist
defaults:
  storage: HYBRID
  heuristic: BEST_EFFORT
  load: trace
  images: 1
  cost_seed: cost.seed
  min_drain: 150
  idle_window: 5
  ff_chunk: 60
  ff_tick: 0.5
  tail_ff: 5726
  platform: disco2-bol.env
  sched_q_med: auto
  sched_q_low: auto
  sched_granularity: stage
  sched_gate_med_ms: 5000
  sched_gate_low_ms: 3000
  sched_window: 8
  sched_frame_overhead_ms: 780
  sched_guard: 'on'
  sched_accept: feas
  sched_k_x10: 20
  sched_smax_high_ms: 12150
  sched_smax_med_ms: 7330
runs:
- label: C5-adaptive-mem-s1
  arrivals: experiments/traces/main2x-s1.trace
  image_prefix: cs12_test_matchedkeep_
  phase0: 0.1202
  soc0: 0.9338
  pipeline: 1
  storage: MEM
