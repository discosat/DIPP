# Stage 5a step 4: the input-size sweep. tools/size_sweep.py runs it against a
# set staged from experiments/sweeps/size-sweep/ (monolith pinned per pipeline;
# module hashes identical to the flight config).
#
# A downstream stage's input is set by frame CONTENT, not only by frames per
# batch, so sizes come from three sources:
#   - one frame per batch across content: six natural validation frames (4, 8,
#     10, 12, 15, 16 water tiles; ~2-15 tiles reach segmentation), a matched
#     test frame (~70 to segmentation, ~23 to the encoder: the campaign
#     operating point) and a keep-all frame (99/99);
#   - natural frames at 2 and 4 frames per batch: emulate_camera repeats the
#     frame, so k x (tiles kept per frame) fills the ~15-55 gap between natural
#     and matched content;
#   - matched and keep-all at 2, 3, 5 frames per batch: the large end, and the
#     frame-level stages (demosaic, tile, monolith) at 1-5 frames.
# Static pipelines 2/6/3 hold every stage at one effort; the monolith is
# pinned low (pipeline 5) and high (pipeline 4) by the sweep config.
# Every cell fits the 120 s module timeout (slowest: J2K high on keep-all at
# k=5, ~37.5 s); the pilot hit the old 30 s limit (monolith high, k=5).
run_set: size-sweep
outdir: analysis/size-sweep
settings: {storage: HYBRID, idle_s: 60, min_drain: 30}
runs:
- {label: p2-low-val04-k1, pipeline: 2, image: cs12_validation_04.bayerRG, images: 1, n: 6}
- {label: p2-low-val11-k1, pipeline: 2, image: cs12_validation_11.bayerRG, images: 1, n: 6}
